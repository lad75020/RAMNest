name: RAMNest
options:
  deploymentTarget:
    macOS: '27.0'
  createIntermediateGroups: true
settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
  base:
    SWIFT_VERSION: '6.0'
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    CLANG_MODULE_CACHE_PATH: $(PROJECT_DIR)/.build/xcode-cache
    SWIFT_MODULE_CACHE_PATH: $(PROJECT_DIR)/.build/xcode-cache
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RAMNestCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/RAMNestCore
      # Explicit file reference even on a clean checkout; the prebuild creates it.
      - path: $(DERIVED_FILE_DIR)/RAMNestNativeAuthority/NativeHelperBuildIdentity.swift
        type: file
        optional: true
        buildPhase: sources
        createIntermediateGroups: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.ramnest.core
        PRODUCT_NAME: RAMNestCore
        DEFINES_MODULE: YES
        SWIFT_INSTALL_OBJC_HEADER: NO
    preBuildScripts:
      - name: Build finalized helper and compiled byte authority before Core
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          native_config=RelWithDebInfo
          if [ "$CONFIGURATION" = Debug ]; then native_config=Debug; fi
          native="$TEMP_DIR/ramnest-native-$CONFIGURATION"
          authority="$BUILT_PRODUCTS_DIR/RAMNestNativeAuthority-$CONFIGURATION"
          /bin/rm -f "$authority/authority.json"
          /bin/bash "$PROJECT_DIR/scripts/build-native.sh" "$native" "$native_config" ramnest-helper
          python3 "$PROJECT_DIR/scripts/native-build-authority.py" generate "$native" "$CONFIGURATION" "$authority" "$DERIVED_FILE_DIR/RAMNestNativeAuthority/NativeHelperBuildIdentity.swift" --staging-dir "$TEMP_DIR/ramnest-authority-stage-$CONFIGURATION"
        inputFiles:
          - $(PROJECT_DIR)/Native/CMakeLists.txt
          - $(PROJECT_DIR)/Native/NativeTmpfsHelper.cpp
          - $(PROJECT_DIR)/Native/NativeTmpfsProtocol.hpp
          - $(PROJECT_DIR)/Native/NativeTmpfsProtocolTests.cpp
          - $(PROJECT_DIR)/scripts/native-provenance.py
          - $(PROJECT_DIR)/scripts/native-build-authority.py
          - $(PROJECT_DIR)/scripts/build-native.sh
        outputFiles:
          - $(TEMP_DIR)/ramnest-native-$(CONFIGURATION)
          - $(TEMP_DIR)/ramnest-authority-stage-$(CONFIGURATION)
          - $(BUILT_PRODUCTS_DIR)/RAMNestNativeAuthority-$(CONFIGURATION)
          - $(BUILT_PRODUCTS_DIR)/RAMNestNativeAuthority-$(CONFIGURATION)/ramnest-helper
          - $(BUILT_PRODUCTS_DIR)/RAMNestNativeAuthority-$(CONFIGURATION)/provenance.json
          - $(BUILT_PRODUCTS_DIR)/RAMNestNativeAuthority-$(CONFIGURATION)/authority.json
          - $(BUILT_PRODUCTS_DIR)/RAMNestNativeAuthority-$(CONFIGURATION)/NativeHelperBuildIdentity.swift
          - $(DERIVED_FILE_DIR)/RAMNestNativeAuthority
          - $(DERIVED_FILE_DIR)/RAMNestNativeAuthority/NativeHelperBuildIdentity.swift
  ramnest:
    type: tool
    platform: macOS
    sources: [Sources/RAMNestCLI]
    dependencies:
      - target: RAMNestCore
  RAMNest:
    type: application
    platform: macOS
    sources:
      - path: Sources/RAMNestApp
      - path: resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.ramnest.app
        INFOPLIST_FILE: resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: RAMNestCore
      - target: ramnest
        link: false
    postBuildScripts:
      - name: Embed freshly rebuilt private helper and CLI
        script: |
          set -eu
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources"
          authority="$BUILT_PRODUCTS_DIR/RAMNestNativeAuthority-$CONFIGURATION"
          python3 "$PROJECT_DIR/scripts/native-build-authority.py" embed "$authority" "$authority/NativeHelperBuildIdentity.swift" "$TARGET_BUILD_DIR/$WRAPPER_NAME"
          cp "$BUILT_PRODUCTS_DIR/ramnest" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/"
        inputFiles:
          - $(PROJECT_DIR)/scripts/native-build-authority.py
          - $(BUILT_PRODUCTS_DIR)/RAMNestNativeAuthority-$(CONFIGURATION)/ramnest-helper
          - $(BUILT_PRODUCTS_DIR)/RAMNestNativeAuthority-$(CONFIGURATION)/provenance.json
          - $(BUILT_PRODUCTS_DIR)/RAMNestNativeAuthority-$(CONFIGURATION)/authority.json
          - $(BUILT_PRODUCTS_DIR)/RAMNestNativeAuthority-$(CONFIGURATION)/NativeHelperBuildIdentity.swift
          - $(BUILT_PRODUCTS_DIR)/ramnest
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ramnest-helper
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ramnest
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/native-provenance.json
  RAMNestCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/RAMNestCoreTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: sh.ramnest.tests
    dependencies:
      - target: RAMNestCore
schemes:
  RAMNest:
    build:
      targets:
        RAMNest: all
        RAMNestCoreTests: [test]
    test:
      targets: [RAMNestCoreTests]
